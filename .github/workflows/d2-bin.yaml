name: d2-bin

on:
  workflow_dispatch:
  push:
    tags:
      - "d2-bin-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run packages/d2-bin/build_wheels.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl

  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            wheel: "*manylinux*x86_64.whl"
          - os: ubuntu-24.04-arm
            wheel: "*manylinux*aarch64.whl"
          - os: macos-latest
            wheel: "*macosx*arm64.whl"
          - os: windows-latest
            wheel: "*win_amd64.whl"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
      - run: |
          uv venv smoke-venv
          uv pip install --python smoke-venv dist/${{ matrix.wheel }}
      - run: |
          export PATH="$PWD/smoke-venv/bin:$PWD/smoke-venv/Scripts:$PATH"
          d2 --version

  publish:
    if: startsWith(github.ref, 'refs/tags/d2-bin-v')
    needs: smoke-test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
      - run: uv publish --trusted-publishing always dist/*.whl
