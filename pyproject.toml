[project]
name = "d2-python"
version = "1.0.0"
description = "An unofficial, fully typed python interface for building .d2 graph files in python."
authors = [
    {name = "David Revay", email = "daverevay@gmail.com"},
    {name = "Robby", email = "h0rv@users.noreply.github.com"}
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "d2-python",
    "d2",
    "py-d2",
    "d2-lang",
    "d2-python",
    "declarative-diagrams",
    "diagram-language",
    "terrastruct",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Typing :: Typed",
]

# Enable once d2-bin 0.9.0 is on PyPI (uv lock cannot resolve it before then):
# [project.optional-dependencies]
# bin = ["d2-bin==0.9.*"]

[project.urls]
Repository = "https://github.com/h0rv/d2-python"
Documentation = "https://github.com/h0rv/d2-python/blob/main/README.md"
"Bug Tracker" = "https://github.com/h0rv/d2-python/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.17",
    "ty>=0.0.91",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "d2"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.ty.environment]
extra-paths = ["packages/d2-bin/src"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["tests"]
norecursedirs = ["tests/_cache"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings
    "COM812",  # conflicts with the formatter
    "CPY001",  # copyright headers
    "EM",      # exception message style
    "TRY003",  # exception message style
    "PLR0913", # Shape and Connection take many options by design
    "PLR0917", # existing positional parameters stay for compatibility
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"examples/**" = ["INP001", "T201"]
"packages/d2-bin/build_wheels.py" = ["INP001", "T201"]

[tool.ty.rules]
all = "error"
